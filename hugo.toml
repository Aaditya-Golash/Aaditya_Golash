baseURL = "https://aaditya-golash.github.io/Aaditya_Golash/"
languageCode = "en-us"
title = "Aaditya Golash"
theme = "PaperMod"

[params]
    env = "production"
    title = "Aaditya Golash"
    description = "Systems thinker building practical solutions across product, operations, data, and engineering."
    author = "Aaditya"
    defaultTheme = "dark"
    disableThemeToggle = false
    mainSections = ["posts"]

    [params.contact]
        formspreeEndpoint = "https://formspree.io/f/xlgpvayk"
        turnstileSiteKey = ""

    [params.profileMode]
        enabled = true
        title = "Aaditya Golash"
        subtitle = "I build systems that reduce friction across organizations."
        displayFullContent = false

        [[params.profileMode.buttons]]
            name = "View Systems"
            url = "systems"

    [[params.socialIcons]]
        name = "linkedin"
        url = "https://linkedin.com/in/aaditya-golash"
    [[params.socialIcons]]
        name = "github"
        url = "https://github.com/Aaditya-Golash"

[menu]
    [[menu.main]]
        identifier = "home"
        name = "Home"
        url = "/"
        weight = 5
    [[menu.main]]
        identifier = "systems"
        name = "Systems"
        url = "/systems"
        weight = 10
    [[menu.main]]
        identifier = "lab"
        name = "Lab"
        url = "/posts"
        weight = 20
    [[menu.main]]
        identifier = "about"
        name = "About"
        url = "/about"
        weight = 30
    [[menu.main]]
        identifier = "contact"
        name = "Contact"
        url = "/contact"
        weight = 40

[markup.goldmark.renderer]
  unsafe = true
