# GitHub Pages project URL. Override with `hugo --baseURL ...` if moving to a custom domain.
baseURL = "https://aaditya-golash.github.io/Aaditya_Golash/"
languageCode = "en-us"
title = "Aaditya Golash"
theme = "PaperMod"

[params]
    env = "production"
    title = "Aaditya Golash"
    description = "UBC BSc Computer Science major and Management minor building workflow, data, and product systems for real operational problems."
    author = "Aaditya"
    defaultTheme = "dark"
    disableThemeToggle = false
    mainSections = ["posts"]

    [params.contact]
        formspreeEndpoint = "https://formspree.io/f/xlgpvayk"
        # Empty means the form uses the built-in honeypot + math challenge only.
        # Add a Cloudflare Turnstile site key here for stronger production spam protection.
        turnstileSiteKey = ""

    [params.profileMode]
        enabled = true
        title = "Aaditya Golash"
        subtitle = "UBC BSc Computer Science major and Management minor building workflow, data, and product systems for real operational problems."
        displayFullContent = false

        [[params.profileMode.buttons]]
            name = "View Projects"
            url = "systems/"

    [[params.socialIcons]]
        name = "linkedin"
        url = "https://linkedin.com/in/aaditya-golash"
    [[params.socialIcons]]
        name = "github"
        url = "https://github.com/Aaditya-Golash"

[menu]
    [[menu.main]]
        identifier = "home"
        name = "Home"
        url = "/"
        weight = 5
    [[menu.main]]
        identifier = "systems"
        name = "Projects"
        url = "systems/"
        weight = 10
    [[menu.main]]
        identifier = "lab"
        name = "All Work"
        url = "posts/"
        weight = 20
    [[menu.main]]
        identifier = "about"
        name = "About"
        url = "about/"
        weight = 30
    [[menu.main]]
        identifier = "resume"
        name = "Resume"
        url = "resume.pdf"
        weight = 35
    [[menu.main]]
        identifier = "contact"
        name = "Contact"
        url = "contact/"
        weight = 40

[markup.goldmark.renderer]
  unsafe = false
