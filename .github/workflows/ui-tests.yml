name: UI and Functional Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: sudo apt-get update && sudo apt-get install -y hugo
      - run: npm install
      - run: npx playwright install --with-deps
      - run: npm test
